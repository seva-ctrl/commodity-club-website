/* =========================================================
   Commodity Trading & Shipping Club — Design System
   Typography + Color CSS Variables
   Inspired by Ferrari's editorial chiaroscuro, adapted for
   a maritime commodities club aesthetic.
   ========================================================= */

/* ---------- Fonts ----------
   FerrariSans is proprietary and cannot be redistributed.
   Substitution: Inter (for UI/body) and Söhne-like stack
   via Inter for headings. For the editorial uppercase "Body-Font"
   role we use a wide-tracked Inter at lighter weights.
   Flagged in README — user should provide licensed files if
   they wish to use their own proprietary fonts.
*/
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');

:root {
  /* ============ COLORS ============ */

  /* --- Brand core (derived from logo) --- */
  --c-navy-ink:       #132531;  /* Primary brand navy — logo hull color */
  --c-navy-deep:      #0B1A24;  /* Deeper navy for hover/pressed states */
  --c-navy-abyssal:   #060F16;  /* Near-black navy — dark cinematic surface */
  --c-navy-tide:      #1E3A4C;  /* Lifted navy for secondary surfaces */

  /* --- Accent / CTA (maritime signal red — lifeboat/flare) --- */
  --c-signal:         #C8321E;  /* Primary CTA — used sparingly */
  --c-signal-deep:    #A02614;  /* Hover/pressed */
  --c-signal-darker:  #7E1C0D;  /* Active */

  /* --- Heritage accent (brass/gold — nautical instruments) --- */
  --c-brass:          #C49A3E;  /* Heritage accent — trophies, markers */
  --c-brass-deep:     #8E6E26;

  /* --- Surfaces --- */
  --c-ivory:          #F8F7F3;  /* Primary light surface — matches logo bg */
  --c-ivory-warm:     #F1EEE6;  /* Warmer ivory for alternate panels */
  --c-paper:          #FFFFFF;  /* Pure white for editorial content */
  --c-surface-dark:   #181818;  /* Near-black primary text / dark secondary surface */
  --c-void:           #000000;  /* Absolute black for hero/cinematic */

  /* --- Neutrals (warm-shifted for maritime feel) --- */
  --c-ink-900:        #121212;
  --c-ink-800:        #1C1C1C;
  --c-ink-700:        #2E2E2E;
  --c-ink-600:        #4A4A4A;
  --c-ink-500:        #6B6B6B;  /* body text secondary */
  --c-ink-400:        #8F8F8F;  /* tertiary text */
  --c-ink-300:        #BFBFBF;  /* disabled, placeholders */
  --c-ink-200:        #D8D4CC;  /* warm borders on ivory */
  --c-ink-100:        #ECE8DF;  /* subtle dividers on ivory */

  /* --- Semantic (accessible) --- */
  --c-success:        #2E6B3E;  /* Confirmed trade — muted seafaring green */
  --c-warning:        #D89A2B;  /* Advisory — brass/amber family */
  --c-danger:         #C8321E;  /* Same as signal — single red */
  --c-info:           #3A6B8C;  /* Chart-ink blue */

  /* --- Overlays --- */
  --c-overlay-dark:   hsla(205, 44%, 6%, 0.82);
  --c-overlay-light:  hsla(40,  20%, 96%, 0.88);

  /* ============ TYPOGRAPHY ============ */
  --ff-sans: "Inter", "Helvetica Neue", Arial, sans-serif;
  --ff-display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --ff-editorial: "Fraunces", "Times New Roman", Georgia, serif; /* optional editorial headline voice */
  --ff-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* Weights */
  --fw-regular: 400;
  --fw-medium:  500;
  --fw-semi:    600;
  --fw-bold:    700;

  /* Sizes — maps Ferrari spec */
  --fs-display:   2.75rem;   /* 44px — larger hero moments */
  --fs-title:     1.625rem;  /* 26px — section titles */
  --fs-card:      1.5rem;    /* 24px — card headings */
  --fs-sub:       1.125rem;  /* 18px — subheadings */
  --fs-ui:        1rem;      /* 16px */
  --fs-button:    1rem;      /* 16px — with wide tracking */
  --fs-button-sm: 0.9rem;    /* 14.4px */
  --fs-nav:       0.8125rem; /* 13px */
  --fs-caption:   0.8125rem; /* 13px */
  --fs-micro-btn: 0.75rem;   /* 12px */
  --fs-label:     0.75rem;   /* 12px — uppercase */
  --fs-micro:     0.6875rem; /* 11px */

  /* Line heights */
  --lh-tight:   1.00;
  --lh-snug:    1.20;
  --lh-normal:  1.30;
  --lh-base:    1.40;
  --lh-relaxed: 1.50;

  /* Tracking */
  --tr-tight:  normal;
  --tr-nav:    0.13px;
  --tr-ui:     0.08px;
  --tr-caption:0.195px;
  --tr-label:  1px;         /* uppercase labels */
  --tr-button: 1.28px;      /* button tracking */
  --tr-micro:  0.96px;

  /* ============ SPACING (8px base) ============ */
  --sp-1:  1px;
  --sp-2:  2px;
  --sp-4:  4px;
  --sp-6:  6px;
  --sp-8:  8px;
  --sp-10: 10px;
  --sp-12: 12px;
  --sp-16: 16px;
  --sp-20: 20px;
  --sp-24: 24px;
  --sp-32: 32px;
  --sp-40: 40px;
  --sp-56: 56px;
  --sp-80: 80px;
  --sp-120:120px;

  /* ============ RADII ============ */
  --r-hair: 1px;
  --r-xs:   2px;    /* default — razor precision */
  --r-sm:   4px;
  --r-md:   8px;    /* modals */
  --r-pill: 999px;
  --r-full: 50%;

  /* ============ ELEVATION ============ */
  --shadow-0: none;
  --shadow-1: rgba(19, 37, 49, 0.12) 1px 1px 1px 0px;
  --shadow-2: rgba(19, 37, 49, 0.18) 0 2px 6px 0px;
  --shadow-card: rgba(19, 37, 49, 0.08) 0 1px 2px 0, rgba(19, 37, 49, 0.06) 0 4px 12px 0;

  /* ============ BORDERS ============ */
  --bd-hair:  1px solid var(--c-ink-200);
  --bd-rule:  1px solid var(--c-ink-300);
  --bd-ink:   1px solid var(--c-navy-ink);
  --bd-white: 1px solid var(--c-paper);

  /* ============ MOTION ============ */
  --ease-std:  cubic-bezier(.2, .0, .0, 1);
  --ease-out:  cubic-bezier(.16, 1, .3, 1);
  --dur-fast:  120ms;
  --dur-base:  220ms;
  --dur-slow:  420ms;
}

/* =========================================================
   SEMANTIC TYPE ROLES
   ========================================================= */

html { font-family: var(--ff-sans); color: var(--c-surface-dark); background: var(--c-ivory); }
body { margin: 0; }

h1, .h1 {
  font-family: var(--ff-display);
  font-size: var(--fs-title);
  font-weight: var(--fw-medium);
  line-height: var(--lh-snug);
  letter-spacing: normal;
  color: var(--c-navy-ink);
  margin: 0;
}

h2, .h2 {
  font-family: var(--ff-display);
  font-size: var(--fs-card);
  font-weight: var(--fw-regular);
  line-height: var(--lh-snug);
  color: var(--c-navy-ink);
  margin: 0;
}

h3, .h3 {
  font-family: var(--ff-sans);
  font-size: var(--fs-sub);
  font-weight: var(--fw-bold);
  line-height: var(--lh-snug);
  color: var(--c-navy-ink);
  margin: 0;
}

h4, .h4 {
  font-family: var(--ff-sans);
  font-size: var(--fs-ui);
  font-weight: var(--fw-medium);
  line-height: var(--lh-base);
  letter-spacing: var(--tr-ui);
  color: var(--c-navy-ink);
  margin: 0;
}

p, .body {
  font-family: var(--ff-sans);
  font-size: var(--fs-ui);
  font-weight: var(--fw-regular);
  line-height: var(--lh-relaxed);
  color: var(--c-surface-dark);
  margin: 0;
}

.body-bold { font-weight: var(--fw-bold); line-height: var(--lh-normal); }

.caption {
  font-family: var(--ff-sans);
  font-size: var(--fs-caption);
  line-height: var(--lh-relaxed);
  letter-spacing: var(--tr-caption);
  color: var(--c-ink-500);
}

/* Uppercase editorial label — the "Body-Font" role */
.label, .label-upper {
  font-family: var(--ff-sans);
  font-size: var(--fs-label);
  font-weight: var(--fw-regular);
  line-height: 1.27;
  letter-spacing: var(--tr-label);
  text-transform: uppercase;
  color: var(--c-ink-500);
}

.label-micro {
  font-family: var(--ff-sans);
  font-size: var(--fs-micro);
  line-height: 1.27;
  letter-spacing: var(--tr-label);
  text-transform: uppercase;
  color: var(--c-ink-500);
}

.nav-link {
  font-family: var(--ff-sans);
  font-size: var(--fs-nav);
  font-weight: var(--fw-semi);
  line-height: var(--lh-snug);
  letter-spacing: var(--tr-nav);
  color: var(--c-paper);
  text-decoration: none;
}
.nav-link:hover { color: var(--c-brass); }

/* =========================================================
   CORE COMPONENT PRIMITIVES
   ========================================================= */

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-8);
  font-family: var(--ff-sans);
  font-size: var(--fs-button);
  font-weight: var(--fw-regular);
  letter-spacing: var(--tr-button);
  padding: var(--sp-12) var(--sp-20);
  border-radius: var(--r-xs);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease-std),
              color var(--dur-base) var(--ease-std),
              border-color var(--dur-base) var(--ease-std);
  text-decoration: none;
}

.btn--primary {
  background: var(--c-paper);
  color: var(--c-navy-ink);
  border-color: var(--c-navy-ink);
}
.btn--primary:hover { background: var(--c-navy-ink); color: var(--c-paper); }

.btn--signal {
  background: var(--c-signal);
  color: var(--c-paper);
  border-color: var(--c-signal);
}
.btn--signal:hover { background: var(--c-signal-deep); border-color: var(--c-signal-deep); }

.btn--ghost {
  background: transparent;
  color: var(--c-paper);
  border-color: var(--c-paper);
}
.btn--ghost:hover { background: var(--c-paper); color: var(--c-navy-ink); }

.btn--ghost-dark {
  background: transparent;
  color: var(--c-navy-ink);
  border-color: var(--c-navy-ink);
}
.btn--ghost-dark:hover { background: var(--c-navy-ink); color: var(--c-paper); }

.btn--sm { font-size: var(--fs-button-sm); font-weight: var(--fw-bold); padding: var(--sp-8) var(--sp-16); letter-spacing: normal; }
.btn--micro { font-size: var(--fs-micro-btn); font-weight: var(--fw-bold); padding: var(--sp-6) var(--sp-12); letter-spacing: var(--tr-micro); }

/* Text link */
.link {
  color: var(--c-navy-ink);
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  transition: color var(--dur-base) var(--ease-std);
}
.link:hover { color: var(--c-signal); }

/* Inputs */
.input {
  width: 100%;
  background: transparent;
  border: 1px solid var(--c-ink-300);
  border-radius: var(--r-xs);
  padding: var(--sp-12) var(--sp-16);
  font-family: var(--ff-sans);
  font-size: var(--fs-ui);
  color: var(--c-surface-dark);
  transition: border-color var(--dur-base) var(--ease-std);
}
.input::placeholder { color: var(--c-ink-400); }
.input:focus { outline: none; border-color: var(--c-navy-ink); }

/* Card */
.card {
  background: var(--c-paper);
  border: none;
  border-radius: 0;
}

/* Section rhythm */
.section--dark  { background: var(--c-void); color: var(--c-paper); }
.section--navy  { background: var(--c-navy-ink); color: var(--c-paper); }
.section--ivory { background: var(--c-ivory); color: var(--c-surface-dark); }
.section--paper { background: var(--c-paper); color: var(--c-surface-dark); }

/* Divider rule */
.rule { height: 1px; background: var(--c-ink-200); border: 0; }
.rule--dark { background: rgba(255,255,255,0.16); }

</style>
<style>
  html, body { margin: 0; background: #F8F7F3; }
  * { box-sizing: border-box; }
  details summary::-webkit-details-marker { display: none; }
  details[open] > summary > span:last-child { transform: rotate(45deg); }
  details > summary > span:last-child { transition: transform 220ms; display: inline-block; }
  select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #132531 50%), linear-gradient(135deg, #132531 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  a.link { color: #132531; text-decoration: none; border-bottom: 1px solid currentColor; transition: color 220ms; }
  a.link:hover { color: #C8321E; }

  /* ---------- Motion system ---------- */
  ::selection { background: rgba(196,154,62,0.35); color: #132531; }
  :focus-visible { outline: 2px solid #C49A3E; outline-offset: 2px; }

  /* Page mount transition (App keys each page) */
  /* fill-mode "backwards" (not "both"): a retained transform would make the
     page wrapper the containing block for position:fixed children
     (reading-progress bar, chart lightbox), pinning them to the document
     instead of the viewport. */
  @keyframes pageEnter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .page-enter { animation: pageEnter 420ms cubic-bezier(0.2, 0.7, 0.3, 1) backwards; }

  /* Scroll-reveal (added by the Reveal component via IntersectionObserver) */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity 700ms cubic-bezier(0.2, 0.7, 0.3, 1), transform 700ms cubic-bezier(0.2, 0.7, 0.3, 1); }
  .reveal.is-visible { opacity: 1; transform: none; }

  /* Hero headline line-by-line mask reveal */
  @keyframes heroline { from { opacity: 0; transform: translateY(105%); } to { opacity: 1; transform: none; } }
  .hero-line { display: block; overflow: hidden; }
  .hero-line > span { display: inline-block; animation: heroline 850ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }

  /* Slow Ken Burns drift on hero photography */
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.06); } }
  .kenburns { animation: kenburns 24s ease-out both; will-change: transform; }

  /* Ticker: pause on hover, soft edge masks */
  .ticker-wrap:hover .ticker-track { animation-play-state: paused; }
  .ticker-wrap { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%); }

  /* Static loading skeleton — markup lives in #root, replaced by the first render */
  @keyframes skel-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .skel { background: rgba(255,255,255,0.08); border-radius: 2px; animation: skel-pulse 1.6s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .page-enter, .hero-line > span, .kenburns, .skel { animation: none !important; }
    .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
    .ticker-track { animation: none !important; }
  }
</style>

<script type="text/babel" data-presets="env,react">



// ======== components/Primitives.jsx ========
/* global React */
const { useState: usePrimState } = React;

function Button({ variant = 'primary', size, children, onClick, as = 'button', href, icon, style, ...rest }) {
  const cls = ['btn', `btn--${variant}`, size ? `btn--${size}` : ''].join(' ').trim();
  if (as === 'a') return <a className={cls} href={href} onClick={onClick} style={style} {...rest}>{icon}{children}</a>;
  return <button className={cls} onClick={onClick} style={style} {...rest}>{icon}{children}</button>;
}

function Label({ children, color, style }) {
  return <div className="label-upper" style={{ color, ...style }}>{children}</div>;
}

function BrassRule({ style, width = 40 }) {
  return <div style={{ width, height: 2, background: '#C49A3E', ...style }} />;
}

function HairRule({ tone = 'light', style }) {
  return <div style={{ height: 1, background: tone === 'dark' ? 'rgba(255,255,255,0.14)' : '#D8D4CC', border: 0, ...style }} />;
}

function Chip({ children, variant = 'outline', style }) {
  const base = {
    fontSize: 11, letterSpacing: '1px', textTransform: 'uppercase',
    padding: '5px 10px', borderRadius: 2, fontWeight: 400, display: 'inline-block'
  };
  const styles = {
    solid: { background: '#132531', color: '#fff' },
    outline: { background: 'transparent', color: '#132531', border: '1px solid #132531' },
    brass: { background: '#C49A3E', color: '#132531' },
    good: { background: '#2E6B3E', color: '#fff' },
    warn: { background: '#D89A2B', color: '#132531' },
    urgent: { background: '#C8321E', color: '#fff' },
    muted: { background: '#ECE8DF', color: '#6B6B6B' },
    darkOutline: { background: 'transparent', color: '#fff', border: '1px solid rgba(255,255,255,0.35)' }
  };
  return <span style={{ ...base, ...styles[variant], ...style }}>{children}</span>;
}

// Editorial image with grayscale filter for B&W tone required by design system
function EditorialImage({ src, alt = '', aspect = '16 / 9', style, overlay = false, grayscale = true }) {
  return (
    <div style={{ position: 'relative', aspectRatio: aspect, overflow: 'hidden', background: '#132531', ...style }}>
      <img src={src} alt={alt} style={{
        width: '100%', height: '100%', objectFit: 'cover', display: 'block',
        filter: grayscale ? 'grayscale(100%) contrast(1.05)' : 'none'
      }} />
      {overlay && <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(6,15,22,0.25) 0%, rgba(6,15,22,0.75) 100%)' }} />}
    </div>);

}

// Navy/void placeholder for when imagery isn't available
function ImagePlaceholder({ label, aspect = '16 / 9', tone = 'dark', style, children }) {
  const bg = tone === 'dark' ?
  'linear-gradient(135deg, #060F16 0%, #132531 60%, #1E3A4C 100%)' :
  'linear-gradient(135deg, #1E3A4C 0%, #2E2E2E 100%)';
  return (
    <div style={{ position: 'relative', aspectRatio: aspect, background: bg, width: '100%', overflow: 'hidden', ...style }}>
      <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.04), transparent 60%)' }} />
      <div style={{ position: 'absolute', left: 16, bottom: 14, fontSize: 11, letterSpacing: 1, textTransform: 'uppercase', color: '#BFBFBF' }}>
        IMAGE — {label}
      </div>
      {children}
    </div>);

}

function ArrowIcon({ size = 12, style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 12 12" fill="none" style={{ display: 'inline-block', ...style }}>
      <path d="M2 10L10 2M10 2H3.5M10 2V8.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="square" />
    </svg>);

}

// Kpler's own wordmark, traced from their site nav (kpler.com). fill="currentColor" so it inherits text color.

function useIsMobile(breakpoint = 768) {
  const [isMobile, setIsMobile] = React.useState(() => window.innerWidth < breakpoint);
  React.useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth < breakpoint);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, [breakpoint]);
  return isMobile;
}

// Scroll-reveal wrapper: fades content up when it enters the viewport.
// Falls back to immediately visible when IntersectionObserver is unavailable
// (old browsers, jsdom tests) or for reduced-motion users (via CSS).
function Reveal({ children, delay = 0, style }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!('IntersectionObserver' in window)) { el.classList.add('is-visible'); return; }
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { el.classList.add('is-visible'); io.disconnect(); }
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <div ref={ref} className="reveal" style={{ transitionDelay: delay ? `${delay}ms` : undefined, ...style }}>{children}</div>;
}

// Hero headline reveal: each line slides up from behind a mask on page load.
function HeroLines({ lines, startDelay = 150 }) {
  return lines.map((line, i) =>
  <span key={i} className="hero-line">
      <span style={{ animationDelay: `${startDelay + i * 110}ms` }}>{line}</span>
    </span>
  );
}

// Animated number for the stats band ("50+" counts up when scrolled into view).
function CountUp({ value, duration = 1300 }) {
  const match = /^(\d+)(.*)$/.exec(value);
  const target = match ? parseInt(match[1], 10) : null;
  const suffix = match ? match[2] : '';
  const [n, setN] = React.useState(0);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (target === null) return;
    const el = ref.current;
    const start = () => {
      const t0 = performance.now();
      const tick = (t) => {
        const p = Math.min((t - t0) / duration, 1);
        setN(Math.round(target * (1 - Math.pow(1 - p, 3)))); // ease-out cubic
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };
    if (!el || !('IntersectionObserver' in window)) { setN(target); return; }
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { start(); io.disconnect(); }
    }, { threshold: 0.4 });
    io.observe(el);
    return () => io.disconnect();
  }, [target, duration]);
  if (target === null) return <span>{value}</span>;
  return <span ref={ref}>{n}{suffix}</span>;
}

function Sparkline({ data, width = 64, height = 20 }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) =>
    `${((i / (data.length - 1)) * width).toFixed(1)},${(height - 2 - ((v - min) / range) * (height - 4)).toFixed(1)}`
  ).join(' ');
  const up = data[data.length - 1] >= data[0];
  return (
    <svg width={width} height={height} style={{ display: 'block' }} aria-hidden="true">
      <polyline points={pts} fill="none" stroke={up ? '#2E6B3E' : '#C8321E'} strokeWidth="1.2" strokeLinejoin="round" />
    </svg>
  );
}

// Live Brent–WTI front spread computed from the AV daily series. The two series
// share the EIA publication calendar, so they're aligned tail-first (most
// recent session last). Renders nothing until both series are available.
function LiveSpreadStrip({ prices = {} }) {
  const brn = prices.BRN && prices.BRN.series;
  const wti = prices.WTI && prices.WTI.series;
  if (!brn || !wti || brn.length < 2 || wti.length < 2) return null;
  const n = Math.min(brn.length, wti.length);
  const series = Array.from({ length: n }, (_, i) => brn[brn.length - n + i] - wti[wti.length - n + i]);
  const last = series[n - 1], delta = last - series[n - 2];
  if (!Number.isFinite(last) || !Number.isFinite(delta)) return null; // stale/malformed cache

  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, padding: '12px 14px', background: '#F8F7F3', borderLeft: '2px solid #C49A3E', marginBottom: 16 }}>
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{ fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 12, color: '#132531', fontWeight: 600 }}>Brent–WTI arb</span>
          <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#2E6B3E', display: 'inline-block' }} title="Computed from live prices" />
        </div>
        <div style={{ fontSize: 11, color: '#8F8F8F', marginTop: 2 }}>Front spread · last {n} sessions · $/bbl</div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
        <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>
          <span style={{ fontSize: 17, fontFamily: 'ui-monospace, Menlo, monospace', color: '#132531', fontWeight: 500 }}>{last.toFixed(2)}</span>
          <span style={{ fontSize: 12, fontFamily: 'ui-monospace, Menlo, monospace', color: delta >= 0 ? '#2E6B3E' : '#C8321E', marginLeft: 8 }}>{delta >= 0 ? '+' : '−'}{Math.abs(delta).toFixed(2)}</span>
        </div>
        <Sparkline data={series} width={90} height={26} />
      </div>
    </div>
  );
}

// ---- Commodity Atlas ------------------------------------------------------
// Every map point stores real lon/lat and is projected at render time:
//   x = 2.778 * (lon + 180), y = 3.69 * (75 - lat), viewBox 0 0 1000 480
// (the same frame scripts/generate-world-paths.mjs uses for the continents).
const projX = (lon) => 2.778 * (lon + 180);
const projY = (lat) => 3.69 * (75 - lat);

// Smooth a route's [lon,lat] waypoints into a quadratic-bezier sea lane.
function routePath(waypoints) {
  const p = waypoints.map(([lon, lat]) => [projX(lon), projY(lat)]);
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
    d += ` Q${p[i][0].toFixed(1)},${p[i][1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  const last = p[p.length - 1];
  d += ` L${last[0].toFixed(1)},${last[1].toFixed(1)}`;
  return d;
}

  { id: 'CCH', name: 'Corpus Christi', sub: 'Texas, US', lon: -97.40, lat: 27.80, kind: 'port', stat: '#1 US crude export port', detail: 'The largest US crude oil export terminal by volume, loading Permian-sourced barrels onto VLCCs bound mainly for Asia and Europe. Expansion of dock capacity here has been a key driver of the US becoming a swing exporter.', anchor: 'end', dy: 12 },
  { id: 'ROT', name: 'Rotterdam ARA', sub: 'Netherlands', lon: 4.48, lat: 51.92, kind: 'hub', primary: true, stat: 'NW Europe products benchmark', detail: 'Europe\'s largest port and refined-products trading and storage hub, anchoring the Amsterdam-Rotterdam-Antwerp (ARA) barge market. Gasoil and fuel oil traded "FOB ARA" set the regional benchmark for Northwest Europe.', dy: 10 },
  { id: 'SUL', name: 'Sullom Voe', sub: 'Shetland Islands, UK', lon: -1.28, lat: 60.48, kind: 'port', stat: 'Brent complex loading terminal', detail: 'Terminal handling Brent and Ninian crude streams from North Sea fields, one of the components underpinning the dated Brent benchmark (BFOET basket). North Sea output has declined but Brent remains the global seaborne reference price.', anchor: 'end', dy: -6 },
  { id: 'RAS', name: 'Ras Tanura', sub: 'Saudi Arabia', lon: 50.16, lat: 26.64, kind: 'port', stat: '~6.5 mb/d export capacity', detail: 'Saudi Aramco\'s largest crude oil export terminal and one of the world\'s biggest oil ports, loading Arab Light and other grades for Asian and Western buyers. Sits at the head of the Gulf, just inside the Strait of Hormuz chokepoint.', anchor: 'end', dy: 16 },
  { id: 'FUJ', name: 'Fujairah', sub: 'UAE', lon: 56.34, lat: 25.12, kind: 'port', stat: 'Mid-East bunkering & storage hub', detail: 'Major bunkering and storage hub on the Gulf of Oman, outside the Strait of Hormuz, a strategic staging point for crude and product cargoes that avoids transiting the strait twice. Closely watched for inventory data as a proxy for regional flows.', anchor: 'end', dy: 38 },
  { id: 'SIN', name: 'Singapore', sub: 'Singapore', lon: 103.82, lat: 1.29, kind: 'hub', primary: true, stat: 'Asia products benchmark (MOPS)', detail: 'The pricing center for Asian refined products via Mean of Platts Singapore (MOPS) assessments, and one of the world\'s largest bunkering ports. Sits directly on the Strait of Malacca, the main artery for Middle East crude heading to East Asia.', dy: 12 },
  { id: 'JAM', name: 'Jamnagar', sub: 'Gujarat, India', lon: 70.05, lat: 22.34, kind: 'port', stat: '1.24 mb/d, world\'s largest refinery', detail: 'Reliance Industries\' refining complex, the single largest refinery in the world by capacity, processing a wide range of crude grades into products exported across Asia, Europe, and the US.', dy: 12 },
  { id: 'NIN', name: 'Ningbo-Zhoushan', sub: 'Zhejiang, China', lon: 121.85, lat: 29.95, kind: 'port', stat: 'Top China crude import hub', detail: 'One of China\'s busiest ports by cargo throughput and a major crude import and storage hub feeding refineries across the Yangtze River Delta. China\'s import volumes here are a closely watched signal of Asian demand.' },
  { id: 'HOR', name: 'Strait of Hormuz', sub: 'Iran / Oman', lon: 56.25, lat: 26.57, kind: 'chokepoint', stat: '~20% of global oil transits', detail: 'The narrow waterway between the Persian Gulf and the Gulf of Oman through which roughly a fifth of global oil and a large share of LNG passes. Any disruption here is a top tail-risk scenario for energy markets.', dy: -14 },
  { id: 'SUE', name: 'Suez Canal', sub: 'Egypt', lon: 32.35, lat: 30.58, kind: 'chokepoint', stat: '~10% of seaborne oil trade', detail: 'Connects the Mediterranean to the Red Sea, allowing tankers moving between the Middle East/Asia and Europe/Americas to avoid the Cape of Good Hope. Closures or attacks near the Bab el-Mandeb approach have repeatedly forced reroutes.', anchor: 'end', dy: -10 },
  { id: 'MAL', name: 'Strait of Malacca', sub: 'Malaysia / Indonesia', lon: 100.5, lat: 3.5, kind: 'chokepoint', stat: '~16 mb/d crude transit', detail: 'The primary shipping lane connecting the Indian Ocean to the South China Sea, carrying the bulk of Middle Eastern crude destined for China, Japan, and South Korea. Narrow at its southern end near Singapore, creating a natural bottleneck.', anchor: 'end', dy: -8 }],
  routes: [

'NAT GAS': {
  points: [
  { id: 'HH', name: 'Henry Hub', sub: 'Louisiana, US', lon: -92.05, lat: 30.05, kind: 'hub', primary: true, stat: '$3.21 / MMBtu', detail: 'The pricing point for NYMEX natural gas futures, a pipeline interconnection in the Louisiana gas grid. Nearly all US gas derivatives and many LNG contracts are priced as a basis differential to "Henry Hub."', dy: 12 },
  { id: 'WAH', name: 'Waha', sub: 'Permian Basin, US', lon: -103.0, lat: 31.0, kind: 'hub', stat: 'often negative basis vs HH', detail: 'Permian Basin gas pricing hub, where associated gas from oil drilling can outstrip pipeline takeaway capacity. Waha prices have repeatedly traded negative, reflecting local oversupply relative to Henry Hub.', anchor: 'end' },
  { id: 'AEC', name: 'AECO', sub: 'Alberta, Canada', lon: -113.5, lat: 51.0, kind: 'hub', stat: 'C$2.05 / GJ', detail: 'Western Canada\'s benchmark gas price hub, reflecting a large supply basin (Montney, Deep Basin) with limited export pipeline access. AECO typically trades at a discount to Henry Hub due to this takeaway constraint.' },
  { id: 'CHI', name: 'Chicago Citygate', sub: 'Illinois, US', lon: -87.65, lat: 41.85, kind: 'hub', stat: '$3.05 / MMBtu', detail: 'A major demarcation point where multiple interstate pipelines deliver gas into the Midwest distribution grid, serving as a regional price reference for utilities and industrial buyers across the Great Lakes region.', anchor: 'end', dy: -6 },
  { id: 'ALG', name: 'Algonquin Citygate', sub: 'Boston, US', lon: -71.06, lat: 42.36, kind: 'hub', stat: 'winter spikes >$20 / MMBtu', detail: 'New England\'s gas delivery point, notorious for extreme winter price spikes due to constrained pipeline capacity into the region. The area increasingly relies on LNG imports during cold snaps.' },
  { id: 'NBP', name: 'NBP', sub: 'United Kingdom', lon: -0.5, lat: 52.0, kind: 'hub', stat: '95p / therm', detail: 'The National Balancing Point is a notional hub representing the UK\'s entire gas transmission system, used as the pricing reference for UK gas trading and closely linked to TTF via interconnector flows.', anchor: 'end', dy: -8 },
  { id: 'TTF', name: 'TTF', sub: 'Netherlands', lon: 5.5, lat: 52.1, kind: 'hub', primary: true, stat: '€39.10 / MWh', detail: 'The Title Transfer Facility is continental Europe\'s benchmark gas price, a virtual trading point on the Dutch grid. Since 2022 it has become the global reference for spot LNG cargoes heading to Europe.', dy: 12 },
  { id: 'JKM', name: 'JKM', sub: 'Japan–Korea Marker', lon: 129.0, lat: 35.0, kind: 'hub', primary: true, stat: '$12.80 / MMBtu', detail: 'The Japan-Korea Marker is the benchmark price for spot LNG cargoes delivered to Northeast Asia, the world\'s largest LNG-importing region. JKM vs TTF spreads drive global cargo routing decisions.' },
  { id: 'SAB', name: 'Sabine Pass', sub: 'Louisiana, US', lon: -93.87, lat: 29.74, kind: 'port', stat: '~30 mtpa LNG capacity', detail: 'One of the largest LNG export terminals in the US, converting Henry Hub-priced gas into liquefied cargoes shipped globally. A bellwether for US feedgas demand and Gulf Coast LNG economics.', anchor: 'end', dy: 14 },
  { id: 'RLF', name: 'Ras Laffan', sub: 'Qatar', lon: 51.55, lat: 25.9, kind: 'port', stat: '~77 mtpa LNG capacity', detail: 'Qatar\'s primary LNG export hub, drawing on the giant North Field, the world\'s largest natural gas field. Qatar\'s low-cost production gives it flexibility to swing cargoes between Atlantic and Pacific basins.', anchor: 'end', dy: -10 },
  { id: 'GLD', name: 'Gladstone', sub: 'Queensland, Australia', lon: 151.25, lat: -23.85, kind: 'port', stat: '~25 mtpa LNG capacity', detail: 'Hub for several coal-seam-gas-to-LNG export projects on Australia\'s east coast, supplying mainly Japanese, Korean, and Chinese buyers under long-term contracts and spot cargoes.', anchor: 'end' },
  { id: 'YAM', name: 'Yamal', sub: 'Sabetta, Russia', lon: 72.05, lat: 71.27, kind: 'port', stat: '~17.4 mtpa LNG capacity', detail: 'Arctic LNG export terminal on the Yamal Peninsula, using ice-class tankers to ship year-round via the Northern Sea Route to Asia in summer and westward to Europe in winter. Subject to Western sanctions affecting financing and shipping.', dy: 10 }],

  { id: 'PJM', name: 'PJM Western Hub', sub: 'Pennsylvania, US', lon: -76.5, lat: 40.5, kind: 'hub', stat: '$34 / MWh avg', detail: 'PJM Interconnection is the largest US grid operator by population served, spanning the Mid-Atlantic and parts of the Midwest. The Western Hub price is a widely traded benchmark for capacity and energy products in the region.', dy: 8 },
  { id: 'CAI', name: 'CAISO SP15', sub: 'Southern California, US', lon: -118.24, lat: 34.05, kind: 'hub', stat: 'negative midday, evening ramps', detail: 'SP15 is the Southern California pricing zone of the California ISO, where heavy solar penetration drives prices to zero or negative during midday hours and sharply higher during the evening "net load" ramp.', anchor: 'end' },
  { id: 'MIS', name: 'MISO', sub: 'Indiana, US', lon: -86.16, lat: 39.77, kind: 'hub', primary: true, stat: '$29 / MWh avg', detail: 'The Midcontinent Independent System Operator runs the wholesale market covering Indiana and much of the Midwest. This is the club\'s home grid: Bloomington sits inside its footprint, making MISO data a natural starting point for local market analysis.', anchor: 'end', dy: -10 },
  { id: 'NPL', name: 'Nord Pool', sub: 'Oslo, Norway', lon: 10.75, lat: 59.91, kind: 'hub', stat: '€45 / MWh, hydro-driven', detail: 'Nord Pool is the day-ahead power exchange for the Nordic and Baltic countries, where abundant hydro reservoir storage means prices are heavily influenced by snowpack and rainfall rather than fuel costs.' },
  { id: 'EPX', name: 'EPEX Core', sub: 'Frankfurt, Germany', lon: 8.68, lat: 50.11, kind: 'hub', stat: '€68 / MWh avg', detail: 'EPEX Spot operates the central European power exchanges spanning Germany, France, and neighboring markets, where prices are set on the margin by gas plants and increasingly shaped by wind and solar output swings.', dy: 12 },
  { id: 'JPX', name: 'JEPX', sub: 'Tokyo, Japan', lon: 139.69, lat: 35.69, kind: 'hub', stat: '¥18 / kWh avg', detail: 'The Japan Electric Power Exchange is the main spot market for Japan\'s regionally fragmented grid, where prices remain sensitive to LNG import costs given Japan\'s heavy reliance on imported gas for generation.' },

'METALS': {
  points: [
  { id: 'LME', name: 'London (LME)', sub: 'United Kingdom', lon: -0.1, lat: 51.5, kind: 'hub', primary: true, anchor: 'end', stat: '$5.12 / lb Cu', detail: 'The London Metal Exchange sets the global benchmark prices and official settlement quotes for copper, aluminum, zinc, nickel, lead and tin. Its ring trading and warehouse network underpin most physical base-metal contracts worldwide, even when the metal never touches the UK.' },
  { id: 'ESC', name: 'Escondida', sub: 'Antofagasta Region, Chile', lon: -69.07, lat: -24.27, kind: 'port', stat: '~5% of world Cu supply', detail: 'The world\'s largest copper mine, operated by BHP and Rio Tinto, sits high in the Atacama Desert. Concentrate is railed and piped down to the coast for shipment, making it a single point of supply risk that traders watch closely during strikes or droughts.', dy: 10 },
  { id: 'ANT', name: 'Antofagasta', sub: 'Chile', lon: -70.4, lat: -23.65, kind: 'port', stat: 'Chile\'s copper gateway', detail: 'The main export gateway for Chilean copper concentrate and cathode, feeding smelters in China and Japan. Port congestion or drought-driven power cuts here can move LME copper spreads within hours.', anchor: 'end', dy: -8 },
  { id: 'PHE', name: 'Port Hedland', sub: 'Western Australia', lon: 118.61, lat: -20.31, kind: 'port', primary: true, stat: '~620 Mt iron ore/yr', detail: 'The world\'s busiest bulk export terminal by tonnage, shipping iron ore from BHP\'s and Fortescue\'s Pilbara mines almost entirely to China. Weekly shipment data here is a closely watched proxy for Chinese steel demand.', anchor: 'end', dy: 10 },
  { id: 'KOL', name: 'Kolwezi', sub: 'Lualaba, DR Congo', lon: 25.47, lat: -10.72, kind: 'port', stat: '~70% of world cobalt', detail: 'The heart of the Central African Copperbelt, producing both copper cathode and the majority of the world\'s mined cobalt, a key battery metal. Landlocked, so output moves by truck and rail to ports in Durban, Dar es Salaam or Lobito before reaching Asian refiners.', anchor: 'end' },
  { id: 'JHB', name: 'Johannesburg', sub: 'South Africa', lon: 28.05, lat: -26.2, kind: 'hub', stat: '~70% of world PGM supply', detail: 'The Witwatersrand basin and the platinum-group-metal mines of the Bushveld Complex make South Africa the dominant source of platinum, palladium and rhodium, used mainly in catalytic converters. South Africa is also a major gold producer and refiner.' },
  { id: 'SOR', name: 'Morowali', sub: 'Sulawesi, Indonesia', lon: 121.34, lat: -2.54, kind: 'port', stat: '~50% of world Ni supply', detail: 'Indonesia\'s nickel belt on Sulawesi hosts massive Chinese-financed smelter complexes converting laterite ore into nickel pig iron and battery-grade products, making it the swing producer that has repeatedly reshaped LME nickel pricing.', dy: 10 },
  { id: 'SHA', name: 'Shanghai', sub: 'China', lon: 121.47, lat: 31.23, kind: 'hub', primary: true, stat: 'SHFE + import premium', detail: 'The Shanghai Futures Exchange trades the dominant onshore contracts for copper, aluminum and zinc, while the Yangshan copper premium signals how eager Chinese buyers are for imported metal versus domestic or bonded-warehouse stock.' },
  { id: 'JOH', name: 'Johor / Singapore', sub: 'Malaysia / Singapore', lon: 103.75, lat: 1.45, kind: 'port', anchor: 'end', dy: 14, stat: 'LME warehouse hub', detail: 'A major LME-approved warehouse cluster where metal can be deposited or withdrawn against exchange contracts. Stock movements here are a key signal of whether physical metal is tightening or loosening relative to paper positions.' },
  { id: 'ROT', name: 'Rotterdam', sub: 'Netherlands', lon: 4.48, lat: 51.92, kind: 'port', dy: 12, stat: 'LME warehouse hub', detail: 'Europe\'s largest LME-registered warehouse location, holding large tonnages of aluminum and other base metals. Rotterdam stock levels and queue lengths feed directly into the LME cash-to-3-month spread.' },
  { id: 'MLC', name: 'Strait of Malacca', sub: 'Malaysia / Indonesia', lon: 100.5, lat: 3.0, kind: 'chokepoint', stat: '~25% of seaborne trade', detail: 'The narrow shipping lane connecting the Indian Ocean to the South China Sea is the main artery for metal concentrate and finished metal moving from Africa, Australia and South America into China, Japan and Korea.', anchor: 'end', dy: -8 },
  { id: 'PAN', name: 'Panama Canal', sub: 'Panama', lon: -79.6, lat: 9.08, kind: 'chokepoint', stat: 'Atlantic–Pacific shortcut', detail: 'Connects the Atlantic and Pacific, shortening the route for South American copper concentrate and North American scrap metal heading to Asian smelters and avoiding the much longer Cape Horn passage.' }],
  routes: [

'AGRICULTURE': {
  points: [
  { id: 'NOL', name: 'New Orleans / US Gulf', sub: 'Louisiana, US', lon: -90.07, lat: 29.0, kind: 'port', primary: true, anchor: 'end', dy: 12, stat: '~60% of US grain exports', detail: 'A string of grain elevators along the lower Mississippi River loads soybeans, corn and wheat barged down from the Midwest onto ocean-going vessels. River levels and barge freight rates here directly affect the basis paid to US farmers.' },
  { id: 'PDX', name: 'Portland / Columbia River', sub: 'Oregon, US', lon: -122.68, lat: 45.51, kind: 'port', stat: 'PNW wheat gateway', detail: 'The Pacific Northwest export corridor ships PNW and Northern Plains wheat directly across the Pacific to Japan, Korea and China, competing with Gulf-origin grain on freight cost and transit time.', dy: -6 },
  { id: 'SAN', name: 'Santos', sub: 'Brazil', lon: -46.33, lat: -23.96, kind: 'port', primary: true, stat: '~45% of Brazil soy exports', detail: 'Latin America\'s largest port and the main outlet for soybeans and corn grown in Mato Grosso and Paraná. Truck queues here during the February-to-April harvest are a recurring logistics bottleneck that traders price into the Brazil-vs-US soybean spread.' },
  { id: 'PGA', name: 'Paranaguá', sub: 'Brazil', lon: -48.51, lat: -25.5, kind: 'port', anchor: 'end', dy: 12, stat: 'Brazil #2 grain port', detail: 'Paraná state\'s deep-water port handles a large share of Brazilian soybean, corn and sugar exports, and is closer to the productive farmland of southern Mato Grosso and Paraná than Santos.' },
  { id: 'ROS', name: 'Rosario (Up River)', sub: 'Argentina', lon: -60.64, lat: -32.95, kind: 'port', anchor: 'end', dy: 14, stat: '#1 soymeal export hub', detail: 'The Paraná River grain belt around Rosario is the world\'s top exporter of soybean meal and oil, crushing soybeans grown across the Pampas before shipping the processed products downriver to the Atlantic.' },
  { id: 'ODE', name: 'Odesa', sub: 'Ukraine', lon: 30.73, lat: 46.48, kind: 'port', stat: 'Black Sea wheat & corn', detail: 'Ukraine\'s main Black Sea grain port, historically a top global exporter of wheat, corn and sunflower oil. Wartime disruptions and the on-again-off-again Black Sea shipping corridor have made flows through here a major driver of wheat volatility.', anchor: 'end', dy: -20 },
  { id: 'NVS', name: 'Novorossiysk', sub: 'Russia', lon: 37.88, lat: 44.72, kind: 'port', stat: 'Russia #1 grain port', detail: 'Russia\'s largest Black Sea grain terminal ships the country\'s record wheat harvests to buyers across the Middle East and North Africa, and Russian export tax and quota policy moves global wheat futures.', dy: 10 },
  { id: 'RUE', name: 'Rouen', sub: 'France', lon: 1.08, lat: 49.44, kind: 'port', stat: 'EU #1 wheat export port', detail: 'France\'s leading grain port on the Seine estuary exports EU soft wheat and barley, mainly to North Africa and the Middle East, making it the benchmark loading point for European (MATIF) wheat cargoes.', dy: 12 },
  { id: 'VAN', name: 'Vancouver', sub: 'Canada', lon: -123.12, lat: 49.28, kind: 'port', stat: 'Wheat & canola gateway', detail: 'The main export terminal for Canadian Prairie wheat and canola, shipping westbound across the Pacific to Asian buyers. Rail capacity from the Prairies to Vancouver is a recurring bottleneck that widens or narrows the canola basis.', anchor: 'end', dy: -8 },
  { id: 'ABJ', name: 'Abidjan', sub: 'Côte d\'Ivoire', lon: -4.0, lat: 5.32, kind: 'port', stat: '~40% of world cocoa', detail: 'Côte d\'Ivoire is the world\'s top cocoa producer, and Abidjan\'s port is where most of that crop is bagged and shipped to grinders in Europe and the US. Together with neighboring Ghana, West Africa supplies roughly two-thirds of global cocoa.' },
  { id: 'HCM', name: 'Ho Chi Minh City', sub: 'Vietnam', lon: 106.7, lat: 10.78, kind: 'port', stat: '~40% of world robusta', detail: 'Vietnam is the world\'s largest producer of robusta coffee, used heavily in instant coffee and espresso blends, and Ho Chi Minh City is the main export point feeding roasters in Europe and Asia.' },
  { id: 'CBT', name: 'Chicago (CBOT)', sub: 'Illinois, US', lon: -87.63, lat: 41.88, kind: 'hub', primary: true, anchor: 'end', stat: 'Corn, soy & wheat futures', detail: 'The Chicago Board of Trade lists the world\'s benchmark futures contracts for corn, soybeans, soybean meal/oil and wheat. Nearly all physical grain contracts globally are priced off a CBOT futures price plus or minus a local basis.' },
  { id: 'BOS', name: 'Bosporus', sub: 'Turkey', lon: 29.0, lat: 41.1, kind: 'chokepoint', stat: 'Black Sea grain chokepoint', detail: 'The narrow strait through Istanbul is the only sea route out of the Black Sea, so essentially all Ukrainian and Russian grain exports must pass through it, subject to Turkish inspection and shipping-risk premiums.', anchor: 'end' },
  { id: 'PAN', name: 'Panama Canal', sub: 'Panama', lon: -79.6, lat: 9.08, kind: 'chokepoint', stat: 'US Gulf → Asia shortcut', detail: 'Used by US Gulf grain cargoes heading to Asian buyers as a shortcut versus rounding South America. Drought-driven draft restrictions on the canal have repeatedly forced grain vessels onto longer, costlier routings.' }],
  routes: [

  { id: 'HOR', name: 'Strait of Hormuz', sub: 'Iran / Oman / UAE', lon: 56.25, lat: 26.57, kind: 'chokepoint', stat: '~20% of global oil', detail: 'The single chokepoint for almost all crude and LNG exports from the Persian Gulf. Any disruption here has the most immediate, outsized effect on tanker rates and oil prices of any chokepoint in the world.', dy: -10 },
  { id: 'MLF', name: 'Strait of Malacca', sub: 'Malaysia / Indonesia', lon: 100.5, lat: 3.0, kind: 'chokepoint', anchor: 'end', dy: -10, stat: '~25% of seaborne trade', detail: 'The shortest sea route between the Indian Ocean and the South China Sea, used by tankers carrying Middle East crude to East Asia and by container ships on the Asia-Europe lane. Vessel size here is constrained by the Malacca-max draft limit.' },
  { id: 'SUE', name: 'Suez Canal', sub: 'Egypt', lon: 32.35, lat: 30.6, kind: 'chokepoint', stat: '~12% of global trade', detail: 'Connects the Mediterranean to the Red Sea, providing the shortest route between Asia and Europe. The 2021 Ever Given grounding and 2024 Red Sea attacks both forced large numbers of vessels to divert around the Cape of Good Hope, lifting tonne-mile demand and freight rates.', anchor: 'end', dy: -8 },
  { id: 'PNF', name: 'Panama Canal', sub: 'Panama', lon: -79.6, lat: 9.08, kind: 'chokepoint', stat: 'Neopanamax lock limit', detail: 'Links the Atlantic and Pacific, used heavily by container ships, LNG carriers and grain vessels. Lock dimensions cap the maximum vessel size ("Neopanamax"), and drought-driven draft restrictions have at times cut daily transits and pushed up effective freight costs.' },
  { id: 'BAB', name: 'Bab el-Mandeb', sub: 'Yemen / Djibouti', lon: 43.4, lat: 12.6, kind: 'chokepoint', stat: 'Red Sea gateway', detail: 'The narrow strait at the southern end of the Red Sea that all Suez-bound traffic from the Indian Ocean must pass through. Attacks on shipping here have repeatedly caused container and tanker traffic to reroute via the Cape of Good Hope.', anchor: 'end', dy: 10 },
  { id: 'BSP', name: 'Bosporus', sub: 'Turkey', lon: 29.0, lat: 41.1, kind: 'chokepoint', anchor: 'end', stat: 'Black Sea outlet', detail: 'The only maritime exit from the Black Sea, used by Russian and Kazakh crude exports as well as Ukrainian and Russian grain. Turkey controls transit under the Montreux Convention and has at times restricted tanker passage during periods of regional tension.' },
  { id: 'CGH', name: 'Cape of Good Hope', sub: 'South Africa', lon: 18.4, lat: -34.35, kind: 'chokepoint', stat: 'Suez diversion route', detail: 'The southern tip of Africa that ships round when avoiding the Suez Canal or Bab el-Mandeb. Routing via the Cape adds 7-14 days to an Asia-Europe voyage, soaking up vessel capacity and supporting freight rates across all ship segments.', dy: 10 },
  { id: 'SGP', name: 'Singapore', sub: 'Singapore', lon: 103.85, lat: 1.29, kind: 'port', primary: true, dy: 12, stat: '#1 bunkering port', detail: 'The world\'s largest bunkering hub, where ships refuel with marine fuel oil and increasingly LNG and biofuel blends. Its position at the mouth of the Malacca Strait also makes it a major transshipment container port and ship-broking center.' },
  { id: 'ROF', name: 'Rotterdam', sub: 'Netherlands', lon: 4.48, lat: 51.92, kind: 'port', primary: true, dy: 12, stat: 'Europe\'s largest port', detail: 'The largest port in Europe by cargo tonnage, handling crude, refined products, containers and dry bulk. It is the key European pricing point for ARA (Amsterdam-Rotterdam-Antwerp) bunker fuel and refined product benchmarks.' },
  { id: 'FUJ', name: 'Fujairah', sub: 'United Arab Emirates', lon: 56.34, lat: 25.12, kind: 'port', stat: '#2 bunkering port', detail: 'Located on the Gulf of Oman just outside the Strait of Hormuz, Fujairah lets tankers bunker without transiting Hormuz twice, and its independently-held oil storage tanks make its inventory data a closely watched market signal.', dy: 14 },
  { id: 'SHF', name: 'Shanghai', sub: 'China', lon: 121.47, lat: 31.23, kind: 'port', stat: '#1 container port', detail: 'The world\'s busiest container port by throughput, anchoring the Asia end of the major east-west container trade lanes and a key driver of Shanghai Containerized Freight Index (SCFI) readings.' },

const DESK_MAP_TITLES = {
  'CRUDE & REFINED': 'Global crude & refined products: hubs, refineries & flows',
  'NAT GAS': 'Global natural gas pricing hubs & LNG flows',
  'POWER': 'Wholesale power markets: grid footprints & trading hubs',
  'METALS': 'Global metals: mines, warehouses & trade lanes',
  'AGRICULTURE': 'Global grains & softs: export terminals & flows',
  'FREIGHT': 'Shipping lanes & maritime chokepoints'
};

const MARKER_KINDS = { hub: 'Pricing hub', port: 'Port / terminal', chokepoint: 'Chokepoint' };

function CommodityMap({ desk }) {
  // displayDesk lags `desk` by one fade so layers cross-fade on tab switch.
  const [displayDesk, setDisplayDesk] = React.useState(desk);
  const [fading, setFading] = React.useState(false);
  const [hover, setHover] = React.useState(null);
  const [pinned, setPinned] = React.useState(null);
  const isMobile = useIsMobile();

  React.useEffect(() => {
    if (desk === displayDesk) return;
    setFading(true);
    const t = setTimeout(() => {
      setDisplayDesk(desk); setHover(null); setPinned(null); setFading(false);
    }, 220);
    return () => clearTimeout(t);
  }, [desk, displayDesk]);

  const layer = DESK_MAPS[displayDesk] || DESK_MAPS['CRUDE & REFINED'];
  const isPower = displayDesk === 'POWER';
  const active = hover ? layer.points.find((p) => p.id === hover) : null;
  const pin = pinned ? layer.points.find((p) => p.id === pinned) : null;

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', flexWrap: 'wrap', gap: 8, marginBottom: 16 }}>
        <div style={{ fontSize: 11, letterSpacing: 1, textTransform: 'uppercase', color: '#6B6B6B' }}>{DESK_MAP_TITLES[displayDesk] || 'Global commodity map'}</div>
        <div style={{ fontSize: 11, color: '#8F8F8F' }}>{isMobile ? 'Tap a point for details' : 'Hover a point · Click to pin details'} · Figures indicative</div>
      </div>

      <div style={{ position: 'relative' }}>
        <svg viewBox="0 0 1000 480" style={{ width: '100%', height: 'auto', display: 'block', background: '#F8F7F3', borderRadius: 2 }}>
          <style>{`@keyframes gasflow { to { stroke-dashoffset: -22; } }`}</style>
          <defs>
            <filter id="regionBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" /></filter>
          </defs>
          {WORLD_PATHS.map((d, i) => <path key={i} d={d} fill="#EAE6DC" stroke="#D8D4CC" strokeWidth="1" strokeLinejoin="round" />)}

          {/* desk layer — cross-fades on tab switch */}
          <g style={{ opacity: fading ? 0 : 1, transition: 'opacity 220ms ease' }}>
            {layer.regions.map((rg) =>
            <g key={rg.name}>
                <ellipse cx={projX(rg.lon)} cy={projY(rg.lat)} rx={2.778 * rg.rx} ry={3.69 * rg.ry}
              fill={isPower ? '#1E3A4C' : '#C49A3E'} opacity={isPower ? 0.18 : 0.13} filter="url(#regionBlur)" />
                {!isPower && !isMobile &&
              <text x={projX(rg.lon)} y={projY(rg.lat) + 3} fill="#B5A57E" fontSize="9" fontFamily="Inter,sans-serif" letterSpacing="1.2" textAnchor="middle" opacity="0.85" style={{ textTransform: 'uppercase' }}>{rg.name}</text>}
              </g>
            )}
            {layer.routes.map((r) => {
              const d = routePath(r.waypoints);
              return (
                <g key={r.id}>
                  <path d={d} fill="none" stroke="#C49A3E" strokeWidth="1.4" strokeDasharray="7 5" opacity="0.75" style={{ animation: 'gasflow 1.6s linear infinite' }}>
                    <title>{r.label}</title>
                  </path>
                  <circle r="3" fill="#C49A3E" stroke="#F8F7F3" strokeWidth="1">
                    <animateMotion dur={`${9 + (r.id.length % 4) * 1.5}s`} begin={`${(r.id.length % 3) * 1.7}s`} repeatCount="indefinite" path={d} />
                  </circle>
                </g>);
            })}
            {layer.points.map((h) => {
              const x = projX(h.lon), y = projY(h.lat);
              const dx = h.anchor === 'end' ? -11 : 11;
              const dy = h.dy || 0;
              const hot = hover === h.id || pinned === h.id;
              const showLabel = !isMobile || h.primary;
              return (
                <g key={h.id} style={{ cursor: 'pointer' }}
                  onMouseEnter={() => setHover(h.id)} onMouseLeave={() => setHover(null)}
                  onClick={() => setPinned(pinned === h.id ? null : h.id)}>
                  <circle cx={x} cy={y} r="14" fill="transparent" />
                  {h.primary && <circle cx={x} cy={y} r="13" fill="#C49A3E" opacity={hot ? 0.3 : 0.15} />}
                  {h.kind === 'chokepoint' ?
                  <rect x={x - 4.6} y={y - 4.6} width="9.2" height="9.2" transform={`rotate(45 ${x} ${y})`} fill="#F8F7F3" stroke={hot ? '#A02614' : '#C8321E'} strokeWidth="1.8" /> :
                  h.kind === 'port' ?
                  <rect x={x - 4.2} y={y - 4.2} width="8.4" height="8.4" transform={`rotate(45 ${x} ${y})`} fill={hot ? '#C8321E' : '#C49A3E'} /> :
                  <circle cx={x} cy={y} r={h.primary ? 6 : 4.5} fill={hot ? '#C8321E' : h.primary ? '#C49A3E' : '#132531'} />}
                  {showLabel && <text x={x + dx} y={y - 5 + dy} fill="#132531" fontSize="13" fontFamily="Inter,sans-serif" fontWeight="600" letterSpacing="0.3" textAnchor={h.anchor === 'end' ? 'end' : 'start'}>{h.name}</text>}
                  {showLabel && !isMobile && <text x={x + dx} y={y + 10 + dy} fill="#8F8F8F" fontSize="10.5" fontFamily="Inter,sans-serif" textAnchor={h.anchor === 'end' ? 'end' : 'start'}>{h.sub}</text>}
                </g>);
            })}
          </g>
        </svg>

        {active && !isMobile &&
        <div style={{
          position: 'absolute',
          left: `${Math.min(Math.max(projX(active.lon) / 10, 12), 84)}%`,
          top: `${projY(active.lat) / 4.8}%`,
          transform: 'translate(-50%, -118%)',
          background: '#132531', color: '#fff', padding: '12px 14px', borderRadius: 2,
          width: 230, pointerEvents: 'none', boxShadow: '0 8px 24px rgba(6,15,22,0.25)', zIndex: 5
        }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>
              <span style={{ fontSize: 14, fontWeight: 600 }}>{active.name}</span>
            </div>
            <div style={{ fontSize: 11, color: '#C49A3E', marginTop: 2, letterSpacing: 0.5, textTransform: 'uppercase' }}>{active.sub}</div>
            <div style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12, color: '#6ED08B', marginTop: 6 }}>{active.stat}</div>
            <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.55)', marginTop: 6 }}>Click to {pinned === active.id ? 'unpin' : 'pin'} details ↓</div>
          </div>}
      </div>

      {/* legend — only the marker kinds this desk actually uses */}
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px 22px', marginTop: 14, alignItems: 'center' }}>
        {layer.points.some((p) => p.kind === 'hub') &&
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 11, color: '#6B6B6B' }}><span style={{ width: 8, height: 8, borderRadius: '50%', background: '#132531', display: 'inline-block' }} /> Pricing hub</span>}
        {layer.points.some((p) => p.primary) &&
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 11, color: '#6B6B6B' }}><span style={{ width: 9, height: 9, borderRadius: '50%', background: '#C49A3E', display: 'inline-block' }} /> Primary benchmark</span>}
        {layer.points.some((p) => p.kind === 'port') &&
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 11, color: '#6B6B6B' }}><span style={{ width: 8, height: 8, background: '#C49A3E', transform: 'rotate(45deg)', display: 'inline-block' }} /> Port / terminal</span>}
        {layer.points.some((p) => p.kind === 'chokepoint') &&
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 11, color: '#6B6B6B' }}><span style={{ width: 8, height: 8, background: '#F8F7F3', border: '1.8px solid #C8321E', transform: 'rotate(45deg)', display: 'inline-block' }} /> Chokepoint</span>}
        {layer.routes.length > 0 &&
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 11, color: '#6B6B6B' }}><span style={{ width: 20, height: 0, borderTop: '1.6px dashed #C49A3E' }} /> Trade flow</span>}
        {layer.regions.length > 0 &&
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 11, color: '#6B6B6B' }}><span style={{ width: 12, height: 12, borderRadius: '50%', background: isPower ? 'rgba(30,58,76,0.25)' : 'rgba(196,154,62,0.3)', display: 'inline-block' }} /> {isPower ? 'Market footprint' : 'Producing region'}</span>}
      </div>

      {/* pinned detail card */}
      {pin &&
      <div className="page-enter" style={{ marginTop: 18, border: '1px solid #D8D4CC', borderLeft: '3px solid #C49A3E', background: '#F8F7F3', padding: isMobile ? '16px 16px' : '18px 22px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12 }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: 1.5, textTransform: 'uppercase', color: pin.kind === 'chokepoint' ? '#C8321E' : '#C49A3E' }}>{MARKER_KINDS[pin.kind] || pin.kind}</span>
                <span style={{ fontSize: 17, fontWeight: 600, color: '#132531' }}>{pin.name}</span>
                <span style={{ fontSize: 12, color: '#6B6B6B' }}>{pin.sub}</span>
              </div>
              <p style={{ fontSize: 13.5, color: '#4A4A4A', lineHeight: 1.7, marginTop: 10, maxWidth: 760 }}>{pin.detail}</p>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexShrink: 0 }}>
              <span style={{ fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 13, color: '#2E6B3E', whiteSpace: 'nowrap' }}>{pin.stat}</span>
              <button onClick={() => setPinned(null)} aria-label="Close details"
            style={{ background: 'transparent', border: '1px solid #D8D4CC', color: '#6B6B6B', width: 26, height: 26, borderRadius: 2, cursor: 'pointer', lineHeight: 1 }}>×</button>
            </div>
          </div>
        </div>}
    </div>
  );
}

function CommoditiesPage({ onNav }) {
  const [active, setActive] = useCommState('CRUDE & REFINED');
  const isMobile = useIsMobile();
  const { prices, status, updatedAt } = useLivePrices();

  // Merge live prices into static commodity data
  const liveCommodities = COMMODITIES.map(group => ({
    ...group,
    items: group.items.map(item => {
      const live = prices[item.sym];
      if (!live) return item;
      return { ...item, price: live.price, chg: live.chg, isLive: true, etfProxy: live.etfProxy, etfLabel: live.etfLabel, series: live.series };
    })
  }));

  const cat = liveCommodities.find((c) => c.cat === active) || liveCommodities[0];

  const statusLabel = status === 'loading' ? 'Fetching live prices…'
    : status === 'error' ? 'Prices indicative'
    : updatedAt ? `Updated ${Math.round((Date.now() - updatedAt) / 60000) || '<1'} min ago`
    : 'Prices indicative';

  return (
    <>

          </h1>
          <p style={{ fontSize: 15, lineHeight: 1.65, color: 'rgba(255,255,255,0.7)', marginTop: 24, maxWidth: 500 }}>

        <div className="ticker-track" style={{ display: 'flex', gap: 48, whiteSpace: 'nowrap', animation: 'ticker 60s linear infinite' }}>

// "$X" is an unfilled figure carried over from the source document — render it
// visibly flagged so it reads as pending rather than a typo.
function renderNewsPara(text) {
  if (!text.includes('$X')) return text;
  const parts = text.split('$X');
  return (
    <>{parts[0]}<mark title="Figure pending — update EDITIONS in index.html" style={{ background: 'rgba(196,154,62,0.22)', color: '#132531', padding: '0 4px', borderBottom: '1px dashed #C49A3E' }}>$X</mark>{parts[1]}</>
  );
}


// Thin brass bar under the top of the viewport showing article scroll progress.
function ReadingProgress() {
  const [p, setP] = React.useState(0);
  React.useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setP(max > 0 ? Math.min(window.scrollY / max, 1) : 0);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div aria-hidden="true" style={{ position: 'fixed', top: 0, left: 0, height: 3, width: `${p * 100}%`, background: '#C49A3E', zIndex: 60 }} />;
}

// ======== LivePrices.js ========
/* global React */

const AV_KEY = 'I8R6FD24WF3Y1JN3';
const FH_KEY = 'd85t531r01qm56kslilgd85t531r01qm56kslim0';
const PRICE_CACHE_KEY = 'ctsc-live-prices-v4'; // v4: fixes CORN/WHEAT $/mt→¢/bu conversion and COFFEE unit, adds RB (gasoline)
const PRICE_CACHE_TTL = 6 * 60 * 60 * 1000; // 6 hours

// Alpha Vantage commodity endpoints
// multiplier: convert AV raw value → display unit shown on site
// AV units (verified against the API's own "unit" field): WTI/BRENT $/bbl,
//           NATURAL_GAS $/MMBtu, COPPER $/mt, ALUMINUM $/mt, CORN $/mt,
//           WHEAT $/mt, COTTON ¢/lb, COFFEE ¢/lb
const BU_PER_MT_CORN = 1000 / 25.40117;  // corn bushel = 56 lb
const BU_PER_MT_WHEAT = 1000 / 27.2155;  // wheat bushel = 60 lb
const AV_MAP = {
  'BRN': { func: 'BRENT',        interval: 'daily',   multiplier: 1,   decimals: 2 },
  'WTI': { func: 'WTI',          interval: 'daily',   multiplier: 1,   decimals: 2 },
  'HH':  { func: 'NATURAL_GAS',  interval: 'daily',   multiplier: 1,   decimals: 2 },
  'CU':  { func: 'COPPER',       interval: 'monthly', multiplier: 1/2204.62, decimals: 3 }, // AV returns $/mt, site shows $/lb
  'AL':  { func: 'ALUMINUM',     interval: 'monthly', multiplier: 1,   decimals: 0 },
  'ZC':  { func: 'CORN',         interval: 'monthly', multiplier: 100 / BU_PER_MT_CORN,  decimals: 2 }, // AV returns $/mt, site shows ¢/bu
  'ZW':  { func: 'WHEAT',        interval: 'monthly', multiplier: 100 / BU_PER_MT_WHEAT, decimals: 2 }, // AV returns $/mt, site shows ¢/bu
  'CT':  { func: 'COTTON',       interval: 'monthly', multiplier: 1,   decimals: 2 },
  'KC':  { func: 'COFFEE',       interval: 'monthly', multiplier: 1,   decimals: 2 }, // AV already returns ¢/lb
};

// Finnhub ETF proxies for paywalled/unavailable commodities
const FH_MAP = {
  'AU': { symbol: 'GLD',  label: 'SPDR Gold ETF' },
  'ZS': { symbol: 'SOYB', label: 'Teucrium Soybean ETF' },
  'LI': { symbol: 'LIT',  label: 'Global X Lithium ETF' },
  'FE': { symbol: 'PICK', label: 'VanEck Steel ETF' },
  'NI': { symbol: 'DBB',  label: 'Invesco Base Metals ETF' },
  'RB': { symbol: 'UGA',  label: 'United States Gasoline Fund' },
};

function fmtChg(curr, prev) {
  const pct = ((curr - prev) / Math.abs(prev)) * 100;
  const sign = pct >= 0 ? '+' : '';
  return `${sign}${pct.toFixed(2)}%`;
}

async function fetchAVCommodity(sym, cfg) {
  const url = `https://www.alphavantage.co/query?function=${cfg.func}&interval=${cfg.interval}&apikey=${AV_KEY}`;
  const res = await fetch(url);
  const json = await res.json();
  if (!json.data || json.data.length < 2) return null; // rate limit or error
  const curr = parseFloat(json.data[0].value) * cfg.multiplier;
  const prev = parseFloat(json.data[1].value) * cfg.multiplier;
  const raw = curr.toFixed(cfg.decimals);
  // format large numbers with comma (e.g. 2,418)
  const price = cfg.decimals === 0 ? Number(raw).toLocaleString('en-US') : raw;
  // recent trend for sparklines: ~30 sessions for daily series, 12 for monthly.
  // AV returns newest-first; reverse so the sparkline reads left → right in time.
  const span = cfg.interval === 'daily' ? 30 : 12;
  const series = json.data.slice(0, span).
  map((d) => parseFloat(d.value) * cfg.multiplier).
  filter((v) => !isNaN(v)).
  reverse();
  return { price, chg: fmtChg(curr, prev), date: json.data[0].date, source: 'alphavantage', series };
}

async function fetchFHQuote(sym, cfg) {
  const url = `https://finnhub.io/api/v1/quote?symbol=${cfg.symbol}&token=${FH_KEY}`;
  const res = await fetch(url);
  const json = await res.json();
  if (!json.c || json.c === 0) return null;
  const sign = json.dp >= 0 ? '+' : '';
  return {
    price: json.c.toFixed(2),
    chg: `${sign}${json.dp.toFixed(2)}%`,
    date: json.t ? new Date(json.t * 1000).toISOString().split('T')[0] : null,
    source: 'finnhub',
    etfProxy: cfg.symbol,
    etfLabel: cfg.label,
  };
}

async function loadLivePrices() {
  const results = {};
  await Promise.allSettled([
    ...Object.entries(AV_MAP).map(([sym, cfg]) =>
      fetchAVCommodity(sym, cfg).then(d => { if (d) results[sym] = d; }).catch(() => {})
    ),
    ...Object.entries(FH_MAP).map(([sym, cfg]) =>
      fetchFHQuote(sym, cfg).then(d => { if (d) results[sym] = d; }).catch(() => {})
    ),
  ]);
  return results;
}

function useLivePrices() {
  const readCache = () => {
    try {
      const c = JSON.parse(localStorage.getItem(PRICE_CACHE_KEY));
      if (c && Date.now() - c.ts < PRICE_CACHE_TTL) return c;
    } catch(e) {}
    return null;
  };

  const init = readCache();
  const [prices, setPrices]       = React.useState(init ? init.prices : {});
  const [status, setStatus]       = React.useState(init ? 'cached' : 'loading');
  const [updatedAt, setUpdatedAt] = React.useState(init ? new Date(init.ts) : null);

  React.useEffect(() => {
    if (readCache()) return; // still fresh, skip fetch
    loadLivePrices()
      .then(p => {
        const ts = Date.now();
        try { localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify({ ts, prices: p })); } catch(e) {}
        setPrices(p);
        setUpdatedAt(new Date(ts));
        setStatus('live');
      })
      .catch(() => setStatus('error'));
  }, []);

  return { prices, status, updatedAt };
}

Object.assign(window, { useLivePrices });
