<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commodity Trading &amp; Shipping Club · Indiana University</title>
<meta name="viewport" content="width=1280">
<style>
/* =========================================================
   Commodity Trading & Shipping Club — Design System
   Typography + Color CSS Variables
   Inspired by Ferrari's editorial chiaroscuro, adapted for
   a maritime commodities club aesthetic.
   ========================================================= */

/* ---------- Fonts ----------
   FerrariSans is proprietary and cannot be redistributed.
   Substitution: Inter (for UI/body) and Söhne-like stack
   via Inter for headings. For the editorial uppercase "Body-Font"
   role we use a wide-tracked Inter at lighter weights.
   Flagged in README — user should provide licensed files if
   they wish to use their own proprietary fonts.
*/
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');

:root {
  /* ============ COLORS ============ */

  /* --- Brand core (derived from logo) --- */
  --c-navy-ink:       #132531;  /* Primary brand navy — logo hull color */
  --c-navy-deep:      #0B1A24;  /* Deeper navy for hover/pressed states */
  --c-navy-abyssal:   #060F16;  /* Near-black navy — dark cinematic surface */
  --c-navy-tide:      #1E3A4C;  /* Lifted navy for secondary surfaces */

  /* --- Accent / CTA (maritime signal red — lifeboat/flare) --- */
  --c-signal:         #C8321E;  /* Primary CTA — used sparingly */
  --c-signal-deep:    #A02614;  /* Hover/pressed */
  --c-signal-darker:  #7E1C0D;  /* Active */

  /* --- Heritage accent (brass/gold — nautical instruments) --- */
  --c-brass:          #C49A3E;  /* Heritage accent — trophies, markers */
  --c-brass-deep:     #8E6E26;

  /* --- Surfaces --- */
  --c-ivory:          #F8F7F3;  /* Primary light surface — matches logo bg */
  --c-ivory-warm:     #F1EEE6;  /* Warmer ivory for alternate panels */
  --c-paper:          #FFFFFF;  /* Pure white for editorial content */
  --c-surface-dark:   #181818;  /* Near-black primary text / dark secondary surface */
  --c-void:           #000000;  /* Absolute black for hero/cinematic */

  /* --- Neutrals (warm-shifted for maritime feel) --- */
  --c-ink-900:        #121212;
  --c-ink-800:        #1C1C1C;
  --c-ink-700:        #2E2E2E;
  --c-ink-600:        #4A4A4A;
  --c-ink-500:        #6B6B6B;  /* body text secondary */
  --c-ink-400:        #8F8F8F;  /* tertiary text */
  --c-ink-300:        #BFBFBF;  /* disabled, placeholders */
  --c-ink-200:        #D8D4CC;  /* warm borders on ivory */
  --c-ink-100:        #ECE8DF;  /* subtle dividers on ivory */

  /* --- Semantic (accessible) --- */
  --c-success:        #2E6B3E;  /* Confirmed trade — muted seafaring green */
  --c-warning:        #D89A2B;  /* Advisory — brass/amber family */
  --c-danger:         #C8321E;  /* Same as signal — single red */
  --c-info:           #3A6B8C;  /* Chart-ink blue */

  /* --- Overlays --- */
  --c-overlay-dark:   hsla(205, 44%, 6%, 0.82);
  --c-overlay-light:  hsla(40,  20%, 96%, 0.88);

  /* ============ TYPOGRAPHY ============ */
  --ff-sans: "Inter", "Helvetica Neue", Arial, sans-serif;
  --ff-display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --ff-editorial: "Fraunces", "Times New Roman", Georgia, serif; /* optional editorial headline voice */
  --ff-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* Weights */
  --fw-regular: 400;
  --fw-medium:  500;
  --fw-semi:    600;
  --fw-bold:    700;

  /* Sizes — maps Ferrari spec */
  --fs-display:   2.75rem;   /* 44px — larger hero moments */
  --fs-title:     1.625rem;  /* 26px — section titles */
  --fs-card:      1.5rem;    /* 24px — card headings */
  --fs-sub:       1.125rem;  /* 18px — subheadings */
  --fs-ui:        1rem;      /* 16px */
  --fs-button:    1rem;      /* 16px — with wide tracking */
  --fs-button-sm: 0.9rem;    /* 14.4px */
  --fs-nav:       0.8125rem; /* 13px */
  --fs-caption:   0.8125rem; /* 13px */
  --fs-micro-btn: 0.75rem;   /* 12px */
  --fs-label:     0.75rem;   /* 12px — uppercase */
  --fs-micro:     0.6875rem; /* 11px */

  /* Line heights */
  --lh-tight:   1.00;
  --lh-snug:    1.20;
  --lh-normal:  1.30;
  --lh-base:    1.40;
  --lh-relaxed: 1.50;

  /* Tracking */
  --tr-tight:  normal;
  --tr-nav:    0.13px;
  --tr-ui:     0.08px;
  --tr-caption:0.195px;
  --tr-label:  1px;         /* uppercase labels */
  --tr-button: 1.28px;      /* button tracking */
  --tr-micro:  0.96px;

  /* ============ SPACING (8px base) ============ */
  --sp-1:  1px;
  --sp-2:  2px;
  --sp-4:  4px;
  --sp-6:  6px;
  --sp-8:  8px;
  --sp-10: 10px;
  --sp-12: 12px;
  --sp-16: 16px;
  --sp-20: 20px;
  --sp-24: 24px;
  --sp-32: 32px;
  --sp-40: 40px;
  --sp-56: 56px;
  --sp-80: 80px;
  --sp-120:120px;

  /* ============ RADII ============ */
  --r-hair: 1px;
  --r-xs:   2px;    /* default — razor precision */
  --r-sm:   4px;
  --r-md:   8px;    /* modals */
  --r-pill: 999px;
  --r-full: 50%;

  /* ============ ELEVATION ============ */
  --shadow-0: none;
  --shadow-1: rgba(19, 37, 49, 0.12) 1px 1px 1px 0px;
  --shadow-2: rgba(19, 37, 49, 0.18) 0 2px 6px 0px;
  --shadow-card: rgba(19, 37, 49, 0.08) 0 1px 2px 0, rgba(19, 37, 49, 0.06) 0 4px 12px 0;

  /* ============ BORDERS ============ */
  --bd-hair:  1px solid var(--c-ink-200);
  --bd-rule:  1px solid var(--c-ink-300);
  --bd-ink:   1px solid var(--c-navy-ink);
  --bd-white: 1px solid var(--c-paper);

  /* ============ MOTION ============ */
  --ease-std:  cubic-bezier(.2, .0, .0, 1);
  --ease-out:  cubic-bezier(.16, 1, .3, 1);
  --dur-fast:  120ms;
  --dur-base:  220ms;
  --dur-slow:  420ms;
}

/* =========================================================
   SEMANTIC TYPE ROLES
   ========================================================= */

html { font-family: var(--ff-sans); color: var(--c-surface-dark); background: var(--c-ivory); }
body { margin: 0; }

h1, .h1 {
  font-family: var(--ff-display);
  font-size: var(--fs-title);
  font-weight: var(--fw-medium);
  line-height: var(--lh-snug);
  letter-spacing: normal;
  color: var(--c-navy-ink);
  margin: 0;
}

h2, .h2 {
  font-family: var(--ff-display);
  font-size: var(--fs-card);
  font-weight: var(--fw-regular);
  line-height: var(--lh-snug);
  color: var(--c-navy-ink);
  margin: 0;
}

h3, .h3 {
  font-family: var(--ff-sans);
  font-size: var(--fs-sub);
  font-weight: var(--fw-bold);
  line-height: var(--lh-snug);
  color: var(--c-navy-ink);
  margin: 0;
}

h4, .h4 {
  font-family: var(--ff-sans);
  font-size: var(--fs-ui);
  font-weight: var(--fw-medium);
  line-height: var(--lh-base);
  letter-spacing: var(--tr-ui);
  color: var(--c-navy-ink);
  margin: 0;
}

p, .body {
  font-family: var(--ff-sans);
  font-size: var(--fs-ui);
  font-weight: var(--fw-regular);
  line-height: var(--lh-relaxed);
  color: var(--c-surface-dark);
  margin: 0;
}

.body-bold { font-weight: var(--fw-bold); line-height: var(--lh-normal); }

.caption {
  font-family: var(--ff-sans);
  font-size: var(--fs-caption);
  line-height: var(--lh-relaxed);
  letter-spacing: var(--tr-caption);
  color: var(--c-ink-500);
}

/* Uppercase editorial label — the "Body-Font" role */
.label, .label-upper {
  font-family: var(--ff-sans);
  font-size: var(--fs-label);
  font-weight: var(--fw-regular);
  line-height: 1.27;
  letter-spacing: var(--tr-label);
  text-transform: uppercase;
  color: var(--c-ink-500);
}

.label-micro {
  font-family: var(--ff-sans);
  font-size: var(--fs-micro);
  line-height: 1.27;
  letter-spacing: var(--tr-label);
  text-transform: uppercase;
  color: var(--c-ink-500);
}

.nav-link {
  font-family: var(--ff-sans);
  font-size: var(--fs-nav);
  font-weight: var(--fw-semi);
  line-height: var(--lh-snug);
  letter-spacing: var(--tr-nav);
  color: var(--c-paper);
  text-decoration: none;
}
.nav-link:hover { color: var(--c-brass); }

/* =========================================================
   CORE COMPONENT PRIMITIVES
   ========================================================= */

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-8);
  font-family: var(--ff-sans);
  font-size: var(--fs-button);
  font-weight: var(--fw-regular);
  letter-spacing: var(--tr-button);
  padding: var(--sp-12) var(--sp-20);
  border-radius: var(--r-xs);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease-std),
              color var(--dur-base) var(--ease-std),
              border-color var(--dur-base) var(--ease-std);
  text-decoration: none;
}

.btn--primary {
  background: var(--c-paper);
  color: var(--c-navy-ink);
  border-color: var(--c-navy-ink);
}
.btn--primary:hover { background: var(--c-navy-ink); color: var(--c-paper); }

.btn--signal {
  background: var(--c-signal);
  color: var(--c-paper);
  border-color: var(--c-signal);
}
.btn--signal:hover { background: var(--c-signal-deep); border-color: var(--c-signal-deep); }

.btn--ghost {
  background: transparent;
  color: var(--c-paper);
  border-color: var(--c-paper);
}
.btn--ghost:hover { background: var(--c-paper); color: var(--c-navy-ink); }

.btn--ghost-dark {
  background: transparent;
  color: var(--c-navy-ink);
  border-color: var(--c-navy-ink);
}
.btn--ghost-dark:hover { background: var(--c-navy-ink); color: var(--c-paper); }

.btn--sm { font-size: var(--fs-button-sm); font-weight: var(--fw-bold); padding: var(--sp-8) var(--sp-16); letter-spacing: normal; }
.btn--micro { font-size: var(--fs-micro-btn); font-weight: var(--fw-bold); padding: var(--sp-6) var(--sp-12); letter-spacing: var(--tr-micro); }

/* Text link */
.link {
  color: var(--c-navy-ink);
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  transition: color var(--dur-base) var(--ease-std);
}
.link:hover { color: var(--c-signal); }

/* Inputs */
.input {
  width: 100%;
  background: transparent;
  border: 1px solid var(--c-ink-300);
  border-radius: var(--r-xs);
  padding: var(--sp-12) var(--sp-16);
  font-family: var(--ff-sans);
  font-size: var(--fs-ui);
  color: var(--c-surface-dark);
  transition: border-color var(--dur-base) var(--ease-std);
}
.input::placeholder { color: var(--c-ink-400); }
.input:focus { outline: none; border-color: var(--c-navy-ink); }

/* Card */
.card {
  background: var(--c-paper);
  border: none;
  border-radius: 0;
}

/* Section rhythm */
.section--dark  { background: var(--c-void); color: var(--c-paper); }
.section--navy  { background: var(--c-navy-ink); color: var(--c-paper); }
.section--ivory { background: var(--c-ivory); color: var(--c-surface-dark); }
.section--paper { background: var(--c-paper); color: var(--c-surface-dark); }

/* Divider rule */
.rule { height: 1px; background: var(--c-ink-200); border: 0; }
.rule--dark { background: rgba(255,255,255,0.16); }

</style>
<style>
  html, body { margin: 0; background: #F8F7F3; }
  * { box-sizing: border-box; }
  details summary::-webkit-details-marker { display: none; }
  details[open] > summary > span:last-child { transform: rotate(45deg); }
  details > summary > span:last-child { transition: transform 220ms; display: inline-block; }
  select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #132531 50%), linear-gradient(135deg, #132531 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  a.link { color: #132531; text-decoration: none; border-bottom: 1px solid currentColor; transition: color 220ms; }
  a.link:hover { color: #C8321E; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react">



// ======== components/Primitives.jsx ========
/* global React */
const { useState: usePrimState } = React;

function Button({ variant = 'primary', size, children, onClick, as = 'button', href, icon, style, ...rest }) {
  const cls = ['btn', `btn--${variant}`, size ? `btn--${size}` : ''].join(' ').trim();
  if (as === 'a') return <a className={cls} href={href} onClick={onClick} style={style} {...rest}>{icon}{children}</a>;
  return <button className={cls} onClick={onClick} style={style} {...rest}>{icon}{children}</button>;
}

function Label({ children, color, style }) {
  return <div className="label-upper" style={{ color, ...style }}>{children}</div>;
}

function BrassRule({ style, width = 40 }) {
  return <div style={{ width, height: 2, background: '#C49A3E', ...style }} />;
}

function HairRule({ tone = 'light', style }) {
  return <div style={{ height: 1, background: tone === 'dark' ? 'rgba(255,255,255,0.14)' : '#D8D4CC', border: 0, ...style }} />;
}

function Chip({ children, variant = 'outline', style }) {
  const base = {
    fontSize: 11, letterSpacing: '1px', textTransform: 'uppercase',
    padding: '5px 10px', borderRadius: 2, fontWeight: 400, display: 'inline-block'
  };
  const styles = {
    solid: { background: '#132531', color: '#fff' },
    outline: { background: 'transparent', color: '#132531', border: '1px solid #132531' },
    brass: { background: '#C49A3E', color: '#132531' },
    good: { background: '#2E6B3E', color: '#fff' },
    warn: { background: '#D89A2B', color: '#132531' },
    urgent: { background: '#C8321E', color: '#fff' },
    muted: { background: '#ECE8DF', color: '#6B6B6B' },
    darkOutline: { background: 'transparent', color: '#fff', border: '1px solid rgba(255,255,255,0.35)' }
  };
  return <span style={{ ...base, ...styles[variant], ...style }}>{children}</span>;
}

// Editorial image with grayscale filter for B&W tone required by design system
function EditorialImage({ src, alt = '', aspect = '16 / 9', style, overlay = false, grayscale = true }) {
  return (
    <div style={{ position: 'relative', aspectRatio: aspect, overflow: 'hidden', background: '#132531', ...style }}>
      <img src={src} alt={alt} style={{
        width: '100%', height: '100%', objectFit: 'cover', display: 'block',
        filter: grayscale ? 'grayscale(100%) contrast(1.05)' : 'none'
      }} />
      {overlay && <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(6,15,22,0.25) 0%, rgba(6,15,22,0.75) 100%)' }} />}
    </div>);

}

// Navy/void placeholder for when imagery isn't available
function ImagePlaceholder({ label, aspect = '16 / 9', tone = 'dark', style, children }) {
  const bg = tone === 'dark' ?
  'linear-gradient(135deg, #060F16 0%, #132531 60%, #1E3A4C 100%)' :
  'linear-gradient(135deg, #1E3A4C 0%, #2E2E2E 100%)';
  return (
    <div style={{ position: 'relative', aspectRatio: aspect, background: bg, width: '100%', overflow: 'hidden', ...style }}>
      <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.04), transparent 60%)' }} />
      <div style={{ position: 'absolute', left: 16, bottom: 14, fontSize: 11, letterSpacing: 1, textTransform: 'uppercase', color: '#BFBFBF' }}>
        IMAGE — {label}
      </div>
      {children}
    </div>);

}

function ArrowIcon({ size = 12, style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 12 12" fill="none" style={{ display: 'inline-block', ...style }}>
      <path d="M2 10L10 2M10 2H3.5M10 2V8.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="square" />
    </svg>);

}

Object.assign(window, { Button, Label, BrassRule, HairRule, Chip, EditorialImage, ImagePlaceholder, ArrowIcon });


// ======== components/Chrome.jsx ========
/* global React, Button, Label, HairRule, ArrowIcon */

function Header({ current = 'about', onNav, tone = 'dark' }) {
  const dark = tone === 'dark';
  const bg = dark ? 'transparent' : '#F8F7F3';
  const fg = dark ? '#fff' : '#132531';
  const sub = dark ? 'rgba(255,255,255,0.65)' : '#6B6B6B';
  const rule = dark ? 'rgba(255,255,255,0.12)' : '#D8D4CC';

  const links = [
  { id: 'about', label: 'About' },
  { id: 'commodities', label: 'Commodities' },
  { id: 'newsletter', label: 'Newsletter' },
  { id: 'membership', label: 'Membership' }];


  return (
    <header style={{
      background: bg, color: fg, padding: '22px 40px',
      borderBottom: `1px solid ${rule}`,
      position: dark ? 'absolute' : 'relative',
      top: 0, left: 0, right: 0, zIndex: 20
    }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 20, maxWidth: 1360, margin: '0 auto' }}>

/* global React, Button, Label, BrassRule, Chip, EditorialImage, ArrowIcon, Header, Footer */
const { useState: useMemState } = React;

                </div>
              </div>
            }

            {step === 3 &&
            <div>
                <div style={{ fontSize: 15, color: '#132531', lineHeight: 1.7 }}>
                  Please review your proposal. Upon submission, the Secretariat will seal the record and deliver it to the Committee before the next sitting.
                </div>
                <div style={{ marginTop: 22, padding: 20, background: '#F1EEE6', borderLeft: '2px solid #C49A3E' }}>
                  <div style={{ fontSize: 11, letterSpacing: 1, textTransform: 'uppercase', color: '#6B6B6B', marginBottom: 8 }}>Proposal record</div>
                  <div style={{ fontSize: 16, fontWeight: 600, color: '#132531' }}>{form.name || '—'}</div>
                  <div style={{ fontSize: 13, color: '#4A4A4A', marginTop: 4 }}>{form.email || '—'}</div>
                  <div style={{ fontSize: 13, color: '#4A4A4A', marginTop: 12 }}>
                    {form.year || '—'} · {form.major || '—'}
                  </div>
                  <div style={{ fontSize: 13, color: '#4A4A4A', marginTop: 4 }}>
                    Proposed by: {form.sponsor || 'General interest queue'}
                  </div>
                  <div style={{ fontSize: 13, color: '#4A4A4A', marginTop: 4 }}>
                    Desks: {form.interest.join(' · ') || '—'}
                  </div>
                  <div style={{ fontSize: 13, color: '#4A4A4A', marginTop: 4 }}>
                    Register: {tier.charAt(0).toUpperCase() + tier.slice(1)}
                  </div>
                </div>
              </div>
            }

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 32 }}>
              <button className="btn btn--ghost-dark btn--sm" onClick={() => setStep(Math.max(1, step - 1))}
              disabled={step === 1} style={{ opacity: step === 1 ? 0.3 : 1 }}>
                ← Back
              </button>
              {step < 3 ?
              <Button variant="primary" onClick={() => setStep(step + 1)}>Continue <ArrowIcon /></Button> :
              <Button variant="signal" onClick={() => alert('Proposal sealed. A note will follow from the Secretariat.')}>
                    Seal &amp; submit <ArrowIcon />
                  </Button>}
            </div>
          </aside>
        </div>
      </section>

      {/* FAQ */}
      <section style={{ background: '#fff', padding: '96px 40px', borderTop: '1px solid #ECE8DF' }}>
        <div style={{ maxWidth: 980, margin: '0 auto' }}>
          <Label style={{ marginBottom: 14 }}>/ House rules</Label>
          <h2 style={{ fontSize: 34, fontWeight: 400, color: '#132531', lineHeight: 1.2, letterSpacing: '-0.01em' }}>
            Questions commonly put to the Secretariat.
          </h2>

          <div style={{ marginTop: 40, borderTop: '1px solid #132531' }}>
            {[
            ['Must I be a finance major to be admitted?', "No. The club draws from across the Kelley School and the university. Members have come from economics, international business, analytics, supply chain, and the liberal arts. What is required is an interest in physical markets and the willingness to study them seriously."],
            ['How many hours each week?', 'The weekly meeting runs ninety minutes. Desk commitments add between two and four hours, depending on the week and the publishing calendar of the Dispatch.'],
            ['Are dues refundable?', 'Dues are collected on the Friday following admission and are non-refundable. A member may resign at any time, in writing, to the Secretariat.'],
            ['Can alumni continue to participate?', 'Yes. Alumni retain their entry in the Register, access to the archive, and the privilege of proposing candidates. Many return as guest principals.'],
            ['Is the club affiliated with the Kelley School?', 'The club is a Registered Student Organization at Indiana University. It is independent of any academic department; its affairs are conducted by the elected officers.']].
            map(([q, a], i) =>
            <details key={i} style={{ borderBottom: '1px solid #ECE8DF' }}>
                <summary style={{
                listStyle: 'none', cursor: 'pointer', padding: '24px 0',
                display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 32
              }}>
                  <span style={{ fontSize: 18, fontWeight: 500, color: '#132531' }}>{q}</span>
                  <span style={{ fontSize: 18, color: '#C49A3E', fontWeight: 300 }}>+</span>
                </summary>
                <div style={{ padding: '0 0 24px', fontSize: 14, color: '#4A4A4A', lineHeight: 1.7, maxWidth: 720 }}>
                  {a}
                </div>
              </details>
            )}
          </div>
        </div>
      </section>

      <Footer onNav={onNav} />
    </>);

}

Object.assign(window, { MembershipPage });



const { useState, useEffect } = React;
function App() {
  const [page, setPage] = useState(() => localStorage.getItem('ctsc-iu-page') || 'about');
  useEffect(() => {
    localStorage.setItem('ctsc-iu-page', page);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, [page]);

  const Page = window[
  { about: 'AboutPage', commodities: 'CommoditiesPage', newsletter: 'NewsletterPage', membership: 'MembershipPage' }[page]] ||
  window.AboutPage;
  if (!Page) return <div style={{ padding: 40, color: '#132531' }}>Loading…</div>;
  return <div data-screen-label={`CTSC · ${page}`}><Page onNav={setPage} /></div>;
}
function boot() {
  if (!window.AboutPage || !window.CommoditiesPage || !window.NewsletterPage || !window.MembershipPage || !window.Header) {
    return setTimeout(boot, 50);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
boot();
</script>
</body>
</html>
